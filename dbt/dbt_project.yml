
name: 'online_shopping_analytics'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  online_shopping_analytics:

    staging:
      +materialized: view
      +schema: intermediate

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      core:
        +materialized: table
        +schema: gold

      aggregates:
        +materialized: table
        +schema: gold
