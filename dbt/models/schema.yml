
version: 2

models:

  - name: silver_orders
    description: Clean, validated and deduplicated orders.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

  - name: dim_customer
    description: Customer dimension with historical profile versions.
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique

  - name: dim_product
    columns:
      - name: product_key
        tests:
          - not_null
          - unique
      - name: product_id
        tests:
          - not_null
          - unique

  - name: dim_payment
    columns:
      - name: payment_key
        tests:
          - not_null
          - unique
      - name: payment_method_id
        tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: full_date
        tests:
          - not_null
          - unique

  - name: fct_orders
    description: Fact table containing one record per order.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: payment_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_payment')
                field: payment_key
